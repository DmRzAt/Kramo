name: ${PROJECT_NAME:-kramo}

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      KRAMO_PAYMENT_MODE: ${KRAMO_PAYMENT_MODE:-sandbox}
      KRAMO_P24_SANDBOX_MERCHANT_ID: ${KRAMO_P24_SANDBOX_MERCHANT_ID:-}
      KRAMO_P24_SANDBOX_CRC_KEY: ${KRAMO_P24_SANDBOX_CRC_KEY:-}
      KRAMO_P24_SANDBOX_REPORTS_KEY: ${KRAMO_P24_SANDBOX_REPORTS_KEY:-}
      KRAMO_P24_LIVE_MERCHANT_ID: ${KRAMO_P24_LIVE_MERCHANT_ID:-}
      KRAMO_P24_LIVE_CRC_KEY: ${KRAMO_P24_LIVE_CRC_KEY:-}
      KRAMO_P24_LIVE_REPORTS_KEY: ${KRAMO_P24_LIVE_REPORTS_KEY:-}
      KRAMO_PAYPAL_SANDBOX_CLIENT_ID: ${KRAMO_PAYPAL_SANDBOX_CLIENT_ID:-}
      KRAMO_PAYPAL_SANDBOX_CLIENT_SECRET: ${KRAMO_PAYPAL_SANDBOX_CLIENT_SECRET:-}
      KRAMO_PAYPAL_SANDBOX_MERCHANT_ID: ${KRAMO_PAYPAL_SANDBOX_MERCHANT_ID:-}
      KRAMO_PAYPAL_SANDBOX_MERCHANT_EMAIL: ${KRAMO_PAYPAL_SANDBOX_MERCHANT_EMAIL:-}
      KRAMO_PAYPAL_LIVE_CLIENT_ID: ${KRAMO_PAYPAL_LIVE_CLIENT_ID:-}
      KRAMO_PAYPAL_LIVE_CLIENT_SECRET: ${KRAMO_PAYPAL_LIVE_CLIENT_SECRET:-}
      KRAMO_PAYPAL_LIVE_MERCHANT_ID: ${KRAMO_PAYPAL_LIVE_MERCHANT_ID:-}
      KRAMO_PAYPAL_LIVE_MERCHANT_EMAIL: ${KRAMO_PAYPAL_LIVE_MERCHANT_EMAIL:-}
    volumes:
      - wp_data:/var/www/html
      - ../theme/kramo-child:/var/www/html/wp-content/themes/kramo-child
      - ../mu-plugins/kramo-payments-bootstrap.php:/var/www/html/wp-content/mu-plugins/kramo-payments-bootstrap.php:ro

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}

  wpcli:
    image: wordpress:cli
    restart: unless-stopped
    user: "33:33"
    working_dir: /var/www/html
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      KRAMO_PAYMENT_MODE: ${KRAMO_PAYMENT_MODE:-sandbox}
      KRAMO_P24_SANDBOX_MERCHANT_ID: ${KRAMO_P24_SANDBOX_MERCHANT_ID:-}
      KRAMO_P24_SANDBOX_CRC_KEY: ${KRAMO_P24_SANDBOX_CRC_KEY:-}
      KRAMO_P24_SANDBOX_REPORTS_KEY: ${KRAMO_P24_SANDBOX_REPORTS_KEY:-}
      KRAMO_P24_LIVE_MERCHANT_ID: ${KRAMO_P24_LIVE_MERCHANT_ID:-}
      KRAMO_P24_LIVE_CRC_KEY: ${KRAMO_P24_LIVE_CRC_KEY:-}
      KRAMO_P24_LIVE_REPORTS_KEY: ${KRAMO_P24_LIVE_REPORTS_KEY:-}
      KRAMO_PAYPAL_SANDBOX_CLIENT_ID: ${KRAMO_PAYPAL_SANDBOX_CLIENT_ID:-}
      KRAMO_PAYPAL_SANDBOX_CLIENT_SECRET: ${KRAMO_PAYPAL_SANDBOX_CLIENT_SECRET:-}
      KRAMO_PAYPAL_SANDBOX_MERCHANT_ID: ${KRAMO_PAYPAL_SANDBOX_MERCHANT_ID:-}
      KRAMO_PAYPAL_SANDBOX_MERCHANT_EMAIL: ${KRAMO_PAYPAL_SANDBOX_MERCHANT_EMAIL:-}
      KRAMO_PAYPAL_LIVE_CLIENT_ID: ${KRAMO_PAYPAL_LIVE_CLIENT_ID:-}
      KRAMO_PAYPAL_LIVE_CLIENT_SECRET: ${KRAMO_PAYPAL_LIVE_CLIENT_SECRET:-}
      KRAMO_PAYPAL_LIVE_MERCHANT_ID: ${KRAMO_PAYPAL_LIVE_MERCHANT_ID:-}
      KRAMO_PAYPAL_LIVE_MERCHANT_EMAIL: ${KRAMO_PAYPAL_LIVE_MERCHANT_EMAIL:-}
    volumes:
      - wp_data:/var/www/html
      - ../theme/kramo-child:/var/www/html/wp-content/themes/kramo-child
      - ../mu-plugins/kramo-payments-bootstrap.php:/var/www/html/wp-content/mu-plugins/kramo-payments-bootstrap.php:ro
      - ../scripts:/scripts:ro

volumes:
  wp_data:
  db_data:
